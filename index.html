<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Urna CIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=JetBrains+Mono:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Tema único claro (sem modo escuro). Layout: faixa da empresa no topo, coluna única para o eleitor (pensada para celular),
   painel em grade para a comissão. Teclas CONFIRMA / CORRIGE / BRANCO seguem a urna brasileira. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#e4ebe5; --fg:#13211b; --muted:#56675f; --line:#cfd9d2;
  --brand:#0f6b4f; --on-brand:#ffffff; --brand-ink:var(--brand);
  --attn-bg:#fdf1c7; --attn-ink:#5a4300; --attn-line:#e9c64a;
  --ok-bg:#dcf1e3; --ok-ink:#145c33; --info-bg:#dfe9f6; --info-ink:#1d4f84; --bad-bg:#fbe3e0; --bad-ink:#9c2219;
  --fill-danger:#b3261e; --key-branco:#f6f6f0; --key-corrige:#e8792b; --key-confirma:#1f8a4c;
  --shadow:0 1px 2px rgba(19,33,27,.06),0 6px 20px rgba(19,33,27,.06);
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800}
h2{font-size:1.3rem;font-weight:750}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
textarea.input{resize:vertical}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.narrow{max-width:640px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-display);font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* faixa da empresa */
.mast{background:var(--brand);color:var(--on-brand)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.mast-logo{width:52px;height:52px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.mast-logo img{max-width:44px;max-height:44px;object-fit:contain}
.mast-emp{font-family:var(--f-display);font-weight:750;font-size:1.1rem;font-stretch:90%;line-height:1.2}
.mast-tit{opacity:.85;font-size:.92rem}
.mast-txt{min-width:0}
.mast-home{display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;min-width:0}
.mast-home:disabled{cursor:default}
.mast-nav{margin-left:auto;display:flex;gap:10px;align-items:center}
.navbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:700;font-size:.92rem;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}
.navbtn:hover{background:rgba(255,255,255,.14)}
.navbtn:active{transform:translateY(1px)}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn.solid{background:#fff;color:var(--brand);border-color:#fff}
.navbtn.solid:hover{background:#eef2ee}
.navbtn.on{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.navbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.navbtn .sm{display:none}
@media (max-width:640px){
  .mast .wrap{flex-wrap:wrap;padding-block:10px;gap:10px}
  .mast-logo{width:42px;height:42px}.mast-logo img{max-width:34px;max-height:34px}
  .mast-emp{font-size:1rem}.mast-tit{font-size:.82rem}
  .mast-nav{width:100%;margin-left:0}
  .navbtn{flex:1;justify-content:center;min-height:40px;padding:0 10px;font-size:.88rem}
  .navbtn .lg{display:none}.navbtn .sm{display:inline}
}
/* tela inicial: cabe numa tela, sem rolagem */
.start{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,5vw,72px);align-items:center;min-height:calc(100vh - 96px);padding-block:20px;max-width:1120px}
.start-intro{display:flex;flex-direction:column;gap:14px;min-width:0}
.start-intro h1{font-size:clamp(2rem,3.6vw,3rem);line-height:1.05}
.start-intro .status-line{margin:0}
.lead{font-size:1.08rem;max-width:46ch}
.passos{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.passos li{display:flex;gap:12px;align-items:center}
.passos li>b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:.9rem}
.passos .kc{display:inline-block;padding:0 6px;border-radius:4px;background:var(--key-confirma);color:#fff;font-family:var(--f-display);font-size:.8rem;letter-spacing:.05em}
.start-form{padding:24px}
.start-form .stack{gap:14px}
@media (max-width:860px){
  .start{grid-template-columns:1fr;min-height:0;gap:14px;padding-block:14px 16px;align-items:start}
  .start-intro{gap:8px}
  .start-intro h1{font-size:1.5rem}
  .lead{font-size:.95rem}
  .passos{display:none}
  .start-form{padding:18px}
  .start-form .stack{gap:12px}
  .start-form .input{padding:10px 12px}
}

/* cartões e formulários */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:1rem}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.input.code{font-family:var(--f-mono);font-size:1.35rem;letter-spacing:.12em;text-transform:uppercase}
.input:disabled{opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:1.5px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--fill-danger);color:#fff}
.btn.attn{background:#f2c230;color:#2b2000}
.btn.big{padding:14px 22px;font-size:1.05rem;width:100%}
.btn.armed{background:var(--fill-danger);color:#fff;border-color:transparent}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--brand-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.msg{padding:12px 14px;border-radius:8px;font-size:.95rem;border:1px solid transparent}
.msg.err{background:var(--bad-bg);color:var(--bad-ink)}
.msg.ok{background:var(--ok-bg);color:var(--ok-ink)}
.msg.attn{background:var(--attn-bg);color:var(--attn-ink);border-color:var(--attn-line)}
.msg.info{background:var(--info-bg);color:var(--info-ink)}

/* status */
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-configuracao{background:var(--surface-2);color:var(--muted)}
.s-aberta{background:var(--ok-bg);color:var(--ok-ink)}
.s-aguardando_prorrogacao{background:var(--attn-bg);color:var(--attn-ink)}
.s-aguardando_encerramento{background:var(--info-bg);color:var(--info-ink)}
.s-encerrada{background:var(--surface-2);color:var(--fg)}

/* eleitor */
.voter{padding-block:24px 120px}
.status-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:16px}
.foot{padding-block:8px 32px;display:flex;justify-content:center}
.cand-grid{--cw:180px;--cols:5;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:min(100%,calc(var(--cw) * var(--cols) + 14px * (var(--cols) - 1)));margin-inline:auto}
.cand-grid.poucos{--cw:220px}
.cand-grid.muitos{--cw:156px}
.cand{flex:0 1 var(--cw);width:var(--cw);position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;overflow:hidden;min-width:0}
.cand img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.cand .ph{width:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-size:2.4rem;font-weight:800;color:var(--muted)}
.cand .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cand .ap{font-family:var(--f-display);font-weight:800;font-size:1.15rem;font-stretch:88%;line-height:1.15;overflow-wrap:anywhere}
.cand .nm{font-size:.85rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.cand .st{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink);margin-top:4px}
@media (max-width:560px){.cand-grid,.cand-grid.poucos,.cand-grid.muitos{--cw:calc(50% - 7px);max-width:100%}}
.cand[aria-pressed="true"]{border-color:var(--key-confirma);box-shadow:0 0 0 3px color-mix(in srgb,var(--key-confirma) 35%,transparent)}
.cand[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--key-confirma);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.urna-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.urna-bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px}
.escolha{min-width:0;flex:1 1 220px}
.escolha strong{font-family:var(--f-display);font-size:1.2rem;font-stretch:88%;display:block;overflow-wrap:anywhere}
.keys{display:flex;gap:8px;flex:1 1 320px}
.key{flex:1;min-height:52px;border-radius:8px;border:1.5px solid rgba(0,0,0,.18);font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:.95rem;cursor:pointer;color:#1a1a1a}
.key.branco{background:var(--key-branco)}
.key.corrige{background:var(--key-corrige)}
.key.confirma{background:var(--key-confirma);color:#fff;flex:1.4}
.key:disabled{opacity:.4;cursor:not-allowed}
.fim{min-height:60vh;display:grid;place-items:center;text-align:center}
.fim-word{font-family:var(--f-display);font-size:clamp(5rem,22vw,9rem);font-weight:800;font-stretch:80%;line-height:1;color:var(--fg);letter-spacing:.04em}

/* painel */
.staffbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.staffbar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.staffbar .who{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role{font-family:var(--f-display);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--brand);color:var(--on-brand)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:12px 0;scrollbar-width:thin}
.tab{padding:9px 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.tabrule{border:0;border-top:1px solid var(--line);margin:0}
.painel{padding-block:20px 80px}
.over{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.over{grid-template-columns:1fr}}
.g-num{font-family:var(--f-display);font-weight:800;font-stretch:82%;font-size:clamp(3rem,9vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums}
.g-num small{font-family:var(--f-body);font-size:1rem;font-weight:600;color:var(--muted);margin-left:8px;font-stretch:100%}
.g-bar{position:relative;height:18px;border-radius:99px;background:var(--surface-2);margin:28px 0 14px}
.g-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand);transition:width .6s}
.g-meta{position:absolute;top:-24px;bottom:-4px;width:0;border-left:2px dashed var(--fg)}
.g-meta span{position:absolute;top:0;left:6px;font-size:.75rem;font-weight:700;white-space:nowrap}
.g-meta.right span{left:auto;right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0}
.stats div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stats dt{font-size:.78rem;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--f-display);font-weight:750;font-size:1.35rem;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.check i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800;margin-top:1px}
.check.ok i{background:var(--ok-bg);color:var(--ok-ink)}
.check.no i{background:var(--bad-bg);color:var(--bad-ink)}
.confs{display:flex;gap:6px;margin:10px 0}
.confs span{flex:1;height:10px;border-radius:99px;background:var(--surface-2)}
.confs span.on{background:var(--key-confirma)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.win td{background:color-mix(in srgb,var(--key-confirma) 10%,transparent)}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;display:block;background:var(--surface-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tag.tit{background:var(--key-confirma);color:#fff}
.tag.sup{background:var(--info-bg);color:var(--info-ink)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.ccard img,.ccard .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2)}
.ccard .ph{display:grid;place-items:center;font-weight:800;color:var(--muted)}
.ccard .t{min-width:0;flex:1}
.ccard .t b{display:block;font-family:var(--f-display);font-stretch:88%;font-size:1.05rem;overflow-wrap:anywhere}
.newcode{font-family:var(--f-mono);font-weight:700;font-size:clamp(2rem,8vw,3rem);letter-spacing:.08em;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;z-index:60;padding:12px 16px;border-radius:8px;background:var(--fg);color:var(--bg);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sitlist{display:flex;flex-wrap:wrap;gap:8px}
.sitlist label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.preview-mast{border-radius:10px;overflow:hidden}

/* barra de demonstração */
.demo-band{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.demo-band .btn{background:#f2c230;color:#2b2000;box-shadow:0 6px 20px rgba(0,0,0,.2)}
body.has-urna .demo-band{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,16,13,.5);display:flex;justify-content:flex-end}
.drawer-in{width:min(460px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.cred td{font-family:var(--f-mono);font-size:.85rem}
@media (max-width:560px){.hide-sm{display:none}.demo-band .btn{min-height:38px;padding:6px 12px;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   CONFIGURAÇÃO DO CLIENTE
   Deixe em branco para rodar em MODO DEMONSTRAÇÃO (dados fictícios).
   Para uma eleição real, cole a URL e a chave "anon public" do Supabase.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://cdyummugdvipgplbkftq.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_3yXXkA01XgHQavktUXSwGA_Ww9DUqAD'
};

const DEMO = !CONFIG.SUPABASE_URL;
const TZ = 'America/Sao_Paulo';
const LIB = {
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};

/* ---------------- utilitários ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = x => JSON.parse(JSON.stringify(x));
const loaded = {};
function loadScript(u) {
  if (!loaded[u]) loaded[u] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = u; s.onload = res;
    s.onerror = () => { delete loaded[u]; rej(new Error('Não foi possível carregar um componente. Verifique a internet e tente de novo.')); };
    document.head.appendChild(s);
  });
  return loaded[u];
}
const fmtDT = iso => iso ? new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) : '—';
const fmtD = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—';
const pctN = (a, b) => b ? 100 * a / b : 0;
const fmtPct = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const faseNome = f => f === 1 ? '1º período' : 'Prorrogação ' + (f - 1);
const primeiroNome = n => String(n || '').trim().split(/\s+/)[0] || '';
const normNome = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const iniciais = n => String(n || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
function dur(ms) {
  if (ms <= 0) return 'encerrado';
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h >= 1) return `${h}h ${String(m % 60).padStart(2, '0')}min`;

function lerImagem(file, max, quadrada) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        if (quadrada) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
        const k = Math.min(1, max / Math.max(sw, sh));
        const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
        const g = c.getContext('2d');
        if (quadrada) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(quadrada ? c.toDataURL('image/jpeg', 0.85) : c.toDataURL('image/png'));
      };
      img.onerror = () => rej(new Error('Não foi possível ler a imagem. Use JPG ou PNG.'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('Não foi possível ler o arquivo.'));
    fr.readAsDataURL(file);
  });
}

async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      // aceita a chave anon antiga (eyJ...) ou a nova chave publishable (sb_publishable_...);
      // a publishable não é um token e vai só no cabeçalho apikey
      headers: Object.assign({ apikey: CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        /^eyJ/.test(CONFIG.SUPABASE_ANON_KEY) ? { Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY } : {}),
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); }
  const txt = await r.text(); let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { /* resposta vazia */ }
  if (!r.ok) throw new Error((data && data.message) || 'O servidor recusou a operação.');
  if (data && data.ok === false) throw new Error(data.erro);
  return data;
}

      S.eleitores.push({ matricula: String(204100 + i * 7), nome, nascimento: `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`, celular: null, setor: pick(setores), situacao: i >= 54 ? (i >= 58 ? 'Afastado' : 'Férias') : 'Ativo', codigo: null, votou: false, tentativas: 0, bloqueado_ate: null, sessao: null });
    }
    const cands = [
      ['Roberto Alves Teixeira', 'Betão', 'Manutenção', '2009-03-02', 18], ['Carla Mendes Rocha', 'Carla da Qualidade', 'Qualidade', '2016-08-15', 150],
      ['José Carlos Pereira Júnior', 'Juninho', 'Produção', '2019-01-07', 30], ['Fátima Aparecida Nunes', 'Dona Fátima', 'Expedição', '2004-05-10', 330],
      ['Marcos Vinícius Lima', 'Marquinhos', 'Logística', '2016-08-15', 210], ['Patrícia Gomes da Silva', 'Paty', 'Administrativo', '2021-10-04', 280]];
    cands.forEach(([nome, apelido, setor, admissao, hue], i) => S.candidatos.push({ id: 11 + i, nome, apelido, setor, admissao, matricula: null, foto: avatar(hue) }));
    S.eleicao = { status: 'configuracao', fase: 1, inicio: null, fim: null, aberta_em: null, encerrada_em: null, encerrada_por: null, codigos_gerados_em: null };
    const L = (ms, ator, acao, det) => S.log.push({ id: ++S.seq, quando: new Date(t0 + ms).toISOString(), ator, acao, detalhe: det || '' });
    L(-4 * 86400000, 'Administrador do sistema', 'Empresa cadastrada', 'Metalúrgica Exemplo Ltda. · CNPJ 00.000.000/0001-00');
    L(-3 * 86400000, 'Administrador do sistema', 'Eleitores importados', '60 registros (lista substituída)');
    L(-3 * 86400000 + 60000, 'Administrador do sistema', 'Candidato cadastrado', '6 candidatos');
    L(-3 * 86400000 + 120000, 'Administrador do sistema', 'Equipe alterada', 'Presidente e 5 membros da comissão eleitoral cadastrados');
    if (modo === 'andamento') {
      S.eleitores.filter(apto).forEach(e => { e.codigo = novoCodigo(); });
      S.eleicao.codigos_gerados_em = new Date(t0 - 2 * 86400000).toISOString();
      L(-2 * 86400000, 'Administrador do sistema', 'Códigos gerados', '58 códigos (todos os anteriores invalidados)');
      const ini = t0 - 15 * 3600000, fim = ini + 24 * 3600000;
      Object.assign(S.eleicao, { status: 'aberta', fase: 1, inicio: new Date(ini).toISOString(), aberta_em: new Date(ini).toISOString(), fim: new Date(fim).toISOString() });
      L(-15 * 3600000, 'Marta Ribeiro Lopes', 'Votação aberta', `1º período de 24 horas, até ${fmtDT(new Date(fim).toISOString())}. 58 eleitores aptos.`);
      const pesos = ['11', '12', '12', '13', '14', '14', '14', '15', '15', '16', 'BRANCO'];
      S.eleitores.filter(apto).slice(10, 27).forEach(e => { e.votou = true; S.votos.push({ escolha: pick(pesos), fase: 1 }); });
      L(-14 * 3600000, 'Beatriz Nogueira', 'Código reemitido', 'Matrícula ' + S.eleitores[30].matricula);
    }
    save();
  }
  S = load();
  if (!S || S.v !== 1) seed('andamento');
  api._demo = {
    reset: modo => seed(modo),
    agora: () => now(),
    simular(n) {
      const E = atualizar(); if (E.status !== 'aberta') throw new Error('Simulação disponível só com a votação aberta.');
      const livres = S.eleitores.filter(e => apto(e) && !e.votou && e.codigo).slice(8);
      const ops = S.candidatos.map(k => String(k.id)).concat(['BRANCO']);
      livres.sort(() => Math.random() - 0.5).slice(0, n).forEach(e => { e.votou = true; S.votos.push({ escolha: ops[Math.floor(Math.random() * ops.length)], fase: E.fase }); });
      save(); return Math.min(n, livres.length);
    },
    avancar() {
      const E = S.eleicao; if (E.status !== 'aberta') throw new Error('O relógio só avança com a votação aberta.');
      S.offset += Date.parse(E.fim) - now() + 1000; save(); atualizar();
    },
    testadores: () => S.eleitores.filter(e => apto(e) && !e.votou && e.codigo).slice(0, 6).map(e => ({ matricula: e.matricula, nascimento: e.nascimento, codigo: e.codigo, nome: e.nome })),
    equipe: () => S.equipe.filter(m => m.ativo).map(m => ({ login: m.login, senha: m.senha, perfil: m.perfil, nome: m.nome })),
    status: () => S.eleicao.status
  };
  return api;
}

function abaAcomp() {

  const p = pctN(P.votantes, P.aptos); const precisa = Math.max(0, (fase === 1 ? Math.ceil(P.aptos / 2) : Math.ceil(P.aptos / 3)) - P.votantes);

    <div class="g-bar" aria-hidden="true"><div class="g-fill" style="width:${Math.min(100, p)}%"></div><div class="g-meta${meta > 80 ? ' right' : ''}" style="left:${meta}%"><span>mínimo ${metaTxt}</span></div></div>

    </dl>
    ${temPeriodo ? `<p class="small muted">Início ${esc(fmtDT(P.inicio))} · Fim ${esc(fmtDT(P.fim))}</p>` : ''}
    <p class="small muted">A contagem de votos por candidato fica oculta para todos até o encerramento.</p>
  </div>`;
  const forcar = P.perfil === 'admin' && P.status !== 'encerrada'

  $('#tabbody').innerHTML = `<div class="over">${gauge}<div class="stack">${cartaoAcao()}${forcar}</div></div>`;

}
function cartaoAcao() {
  const P = A.painel, perf = P.perfil, pr = P.prorrogacao, nec = P.config.confirmacoes_necessarias;
  const barraConf = pr ? `<div class="confs">${Array.from({ length: nec }, (_, i) => `<span class="${i < pr.confirmacoes.length ? 'on' : ''}"></span>`).join('')}</div>
    <p class="small"><b>${pr.confirmacoes.length} de ${nec}</b> confirmações${pr.confirmacoes.length ? ': ' + pr.confirmacoes.map(c => esc(c.nome)).join(', ') : ''}</p>` : '';
  if (P.status === 'configuracao') {
    const it = [
      [P.config.empresa && P.config.empresa !== 'Nome da empresa', 'Dados da empresa preenchidos'],
      [P.aptos > 0, `Eleitores importados (${P.aptos} aptos)`],
      [P.candidatos > 0, `Candidatos cadastrados (${P.candidatos})`],
      [!!P.codigos_gerados_em && !P.sem_codigo, 'Códigos de acesso gerados para todos'],
      [P.mesarios >= nec, `Membros da comissão eleitoral cadastrados (${P.mesarios}, mínimo ${nec})`]];
    const pronto = it.every(x => x[0]);
    return `<div class="card stack"><h2>Preparação</h2>
      <div>${it.map(([ok, t]) => `<div class="check ${ok ? 'ok' : 'no'}"><i>${ok ? '✓' : '!'}</i><span>${esc(t)}</span></div>`).join('')}</div>
      ${perf === 'presidente' ? `<button class="btn big" id="b-abrir" ${pronto ? '' : 'disabled'}>Abrir votação por ${P.config.duracao_horas} horas</button>
        <p class="small muted">${pronto ? 'Depois de aberta, eleitores e candidatos ficam bloqueados para alteração.' : 'Complete os itens acima para liberar a abertura.'}</p>`
        : `<p class="small muted">A abertura é feita pelo presidente da comissão.</p>`}</div>`;
  }
  if (P.status === 'aberta') {
    return `<div class="card stack"><h2>Votação em andamento</h2>
      <p>O sistema verifica a participação automaticamente às <b>${esc(fmtDT(P.fim))}</b>.</p>
      <p class="small muted">Se atingir ${P.fase === 1 ? '50%' : '1/3'} dos aptos, o presidente poderá encerrar. Se não, a votação pausa e pede prorrogação. Se todos votarem antes do prazo, o encerramento é liberado na hora.</p>
      ${perf === 'presidente' ? `<button class="btn big" disabled>Solicitar encerramento</button><p class="small muted">Disponível ao fim do período ou quando todos votarem. O encerramento sempre depende da confirmação dos membros da comissão eleitoral.</p>` : ''}</div>`;
  }
  if (P.status === 'aguardando_prorrogacao') {
    let corpo = `<div class="msg attn"><b>Participação abaixo do mínimo.</b> A votação está pausada e o encerramento está bloqueado. Na prorrogação, o mínimo passa a ser 1/3 dos eleitores aptos.</div>`;
    if (perf === 'presidente') {
      corpo += pr ? `<h3>Prorrogação solicitada</h3><p class="small muted">Aguardando os membros da comissão eleitoral. Pedido feito em ${esc(fmtDT(pr.solicitada_em))}.</p>${barraConf}`
        : `<button class="btn big attn" id="b-prorrogar">Prorrogar por mais ${P.config.duracao_horas}h</button><p class="small muted">A prorrogação só começa depois que ${nec} membros da comissão eleitoral confirmarem no painel deles.</p>`;
      corpo += `<button class="btn big" disabled>Solicitar encerramento</button>`;
    } else if (perf === 'mesario') {
      corpo += pr ? `<h3>Pedido de prorrogação</h3><p class="small">${esc(pr.solicitada_por)} pediu a prorrogação em ${esc(fmtDT(pr.solicitada_em))}.</p>${barraConf}
        ${pr.eu_confirmei ? `<div class="msg ok">Você já confirmou.</div>` : `<button class="btn big" id="b-confirmar">Confirmar prorrogação</button>`}`
        : `<p class="small muted">Aguardando o presidente solicitar a prorrogação.</p>`;
    } else corpo += pr ? barraConf : '';
    return `<div class="card stack"><h2>Prorrogação</h2>${corpo}</div>`;
  }
  if (P.status === 'aguardando_encerramento') {
    let enc = '';
    if (perf === 'presidente') enc = pr ? `<h3>Encerramento solicitado</h3><p class="small muted">Aguardando os membros da comissão eleitoral. Pedido feito em ${esc(fmtDT(pr.solicitada_em))}.</p>${barraConf}<p class="small muted">A apuração aparece assim que a última confirmação chegar.</p>`
      : `<button class="btn big" id="b-encerrar">Solicitar encerramento aos membros da comissão eleitoral</button><p class="small muted">A votação só encerra depois que ${nec} membros da comissão eleitoral confirmarem no painel deles. Faça o encerramento com os representantes presentes; a apuração aparece na hora e gera a ata em PDF.</p>`;
    else if (perf === 'mesario') enc = pr ? `<h3>Pedido de encerramento</h3><p class="small">${esc(pr.solicitada_por)} pediu o encerramento em ${esc(fmtDT(pr.solicitada_em))}.</p>${barraConf}
        ${pr.eu_confirmei ? `<div class="msg ok">Você já confirmou.</div>` : `<button class="btn big" id="b-confirmar">Confirmar encerramento</button><p class="small muted">Ao confirmar, você atesta que acompanhou o processo. Sua confirmação fica registrada e sai na ata.</p>`}`
      : `<p class="small muted">Aguardando o presidente solicitar o encerramento.</p>`;
    else enc = pr ? barraConf : `<p class="small muted">Aguardando o presidente solicitar o encerramento.</p>`;
    const destaque = perf === 'mesario' && pr && !pr.eu_confirmei ? ' style="border:2px solid var(--key-confirma)"' : '';
    return `<div class="card stack"${destaque}><h2>Encerramento</h2>
      ${P.aptos > 0 && P.votantes >= P.aptos ? `<div class="msg ok"><b>Todos os eleitores aptos votaram (100%).</b> O encerramento foi liberado antes do fim do prazo.</div>` : `<div class="msg ok"><b>Mínimo atingido.</b> O período terminou e a votação pode ser encerrada.</div>`}
      ${enc}</div>`;
  }
  return `<div class="card stack"><h2>Eleição encerrada</h2><p>Encerrada em ${esc(fmtDT(P.encerrada_em))} por ${esc(P.encerrada_por)}.</p>
    ${P.encerramento_tipo === 'administrativo' ? `<div class="msg attn"><b>Encerramento administrativo.</b> Justificativa: ${esc(P.justificativa)}</div>` : ''}
    <button class="btn big" id="b-ver-res">Ver resultado e baixar a ata</button></div>`;
}

      <p class="small muted">Colunas aceitas: <b>Nome, Matrícula, Data de Nascimento, Setor, Situação</b> e, opcionalmente, <b>Celular</b>. Formatos .xlsx, .xls ou .csv.</p>
      <div class="row"><button class="btn ghost" id="b-modelo">Baixar planilha modelo</button></div>
      <div class="field"><label for="imp-file">Arquivo da planilha</label><input class="input" type="file" id="imp-file" accept=".xlsx,.xls,.csv"></div>
      <div id="imp-out"></div>`}
    </div></div>`;
  const bs = $('#b-sit'); if (bs) bs.onclick = async () => {
    try { await API.salvarConfig(A.staff.token, { situacoes_aptas: $$('.sit').filter(x => x.checked).map(x => x.value) }); toast('Situações salvas. Gere os códigos novamente se a lista de aptos mudou.'); await atualizarPainel(); abaEleitores(); } catch (e) { toast(e.message); }
  };

  const fi = $('#imp-file'); if (fi) fi.addEventListener('change', async ev => { const f = ev.target.files[0]; if (f) await lerPlanilha(f); });
}
const normKey = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
const MAPA = { nome: 'nome', nomecompleto: 'nome', matricula: 'matricula', registro: 'matricula', datadenascimento: 'nascimento', nascimento: 'nascimento', datanascimento: 'nascimento', dtnascimento: 'nascimento', celular: 'celular', telefone: 'celular', setor: 'setor', departamento: 'setor', area: 'setor', situacao: 'situacao', status: 'situacao' };
function dataPlanilha(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number' && window.XLSX) { const d = XLSX.SSF.parse_date_code(v); if (d && d.y > 1900) return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; return null; }
  const s = String(v).trim();
  const br = parseDataBR(s); if (br) return br;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
async function lerPlanilha(file) {
  const out = $('#imp-out'); out.innerHTML = `<p class="muted small">Lendo planilha…</p>`;
  try {
    await loadScript(LIB.xlsx);
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(ws, { raw: true, defval: '' });
    const ok = [], erros = [], vistos = new Set();
    linhas.forEach((l, i) => {
      const r = {}; Object.keys(l).forEach(k => { const c = MAPA[normKey(k)]; if (c) r[c] = l[k]; });
      if (!String(r.nome || '').trim() && !String(r.matricula || '').trim()) return;
      const mat = typeof r.matricula === 'number' ? String(Math.round(r.matricula)) : String(r.matricula || '').trim();
      const nasc = dataPlanilha(r.nascimento);
      const prob = [];
      if (!String(r.nome || '').trim()) prob.push('sem nome');
      if (!mat) prob.push('sem matrícula');
      if (!nasc) prob.push('data de nascimento inválida');
      if (mat && vistos.has(mat)) prob.push('matrícula repetida');
      if (prob.length) { erros.push({ linha: i + 2, nome: r.nome, prob: prob.join(', ') }); return; }
      vistos.add(mat);
      ok.push({ matricula: mat, nome: String(r.nome).trim(), nascimento: nasc, celular: r.celular === '' || r.celular == null ? null : String(typeof r.celular === 'number' ? Math.round(r.celular) : r.celular).trim(), setor: String(r.setor || '').trim(), situacao: String(r.situacao || '').trim() || 'Ativo' });
    });
    A.importacao = ok;
    out.innerHTML = `<div class="stack">
      <div class="msg ${erros.length ? 'attn' : 'ok'}"><b>${ok.length}</b> linhas prontas para importar${erros.length ? ` · <b>${erros.length}</b> com problema (não serão importadas)` : ''}.</div>
      ${erros.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Linha</th><th>Nome</th><th>Problema</th></tr></thead><tbody>${erros.slice(0, 30).map(e => `<tr><td class="num">${e.linha}</td><td>${esc(e.nome)}</td><td>${esc(e.prob)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${ok.length ? `<div class="row"><button class="btn" id="b-imp-sub">Substituir a lista atual por estas ${ok.length}</button><button class="btn ghost" id="b-imp-add">Adicionar ou atualizar</button></div>
      <p class="small muted">Substituir apaga os eleitores atuais e exige gerar os códigos de novo.</p>` : ''}</div>`;
    const go = async sub => {
      const L = A.importacao; const tam = 500;
      try {
        for (let i = 0; i < L.length; i += tam) { out.querySelector('.msg').textContent = `Importando ${Math.min(i + tam, L.length)} de ${L.length}…`; await API.importarEleitores(A.staff.token, L.slice(i, i + tam), sub && i === 0); }
        toast(`${L.length} eleitores importados.`); A.importacao = null; await atualizarPainel(); abaEleitores();
      } catch (e) { toast(e.message); }
    };
    const b1 = $('#b-imp-sub'); if (b1) armar(b1, 'Clique de novo para substituir', () => go(true));
    const b2 = $('#b-imp-add'); if (b2) b2.onclick = () => go(false);
  } catch (e) { out.innerHTML = `<div class="msg err">${esc(e.message || 'Não foi possível ler a planilha.')}</div>`; }
}
async function baixarModelo() {

  await salvarArquivo(`ata-eleicao-cipa-${slug(cfg.empresa)}.pdf`, d.output('blob'));
}
async function baixarAtaAdmin(R, L, emissor) {
  const cfg = R.config; const K = await pdfKit(cfg); const d = K.d;
  const hash = sha256hex(baseVerificacao(R)).toUpperCase();
  const cod = hash.slice(0, 16).match(/.{4}/g).join('-');
  const logAsc = (L || []).slice().reverse();
  const hashLog = sha256hex(JSON.stringify(logAsc.map(l => [l.quando, l.ator, l.acao, l.detalhe]))).toUpperCase();
  const agora = new Date().toISOString(); const mut = [86, 103, 95];
  const cont = a => logAsc.filter(l => l.acao === a).length;
  K.cabecalho('ATA DE VERIFICAÇÃO DO RESULTADO', 'Via de guarda do administrador do sistema · ' + [cfg.titulo, cfg.gestao && 'Gestão ' + cfg.gestao].filter(Boolean).join(' · '));
  K.paragrafo(`Este documento é a via de verificação da Ata de Apuração emitida pela Comissão Eleitoral. Ele é gerado a partir dos mesmos dados gravados no banco de dados do sistema e serve para comprovar, junto à fiscalização do trabalho ou em processo judicial, que a ata apresentada pela Comissão Eleitoral corresponde ao resultado oficialmente registrado. Para a comparação, confira o código de verificação, os números da apuração e a linha do tempo nos dois documentos.`, { s: 9.5 });
  K.secao('1. Identificação da eleição');
  K.tabela([{ t: 'Item', w: 62 }, { t: 'Informação', w: K.CW - 62 }], [
    { c: ['Empresa', [cfg.empresa, cfg.cnpj && 'CNPJ ' + cfg.cnpj].filter(Boolean).join(' · ')] },
    { c: ['Estabelecimento', cfg.endereco || '—'] },
    { c: ['Eleição', [cfg.titulo, cfg.gestao && 'Gestão ' + cfg.gestao].filter(Boolean).join(' · ')] },
    { c: ['Endereço da votação', cfg.url_site || '—'] },
    { c: ['Abertura da votação', fmtDT(R.aberta_em)] },
    { c: ['Encerramento', `${fmtDT(R.encerrada_em)} · ${R.encerramento_tipo === 'administrativo' ? 'encerramento administrativo por ' + R.encerrada_por : 'a pedido de ' + R.encerrada_por + ', confirmado por ' + ((R.confirmacoes_encerramento || []).map(c => c.nome).join(', ') || '—')}`] },
    { c: ['Vagas', `${cfg.vagas_titulares} titulares e ${cfg.vagas_suplentes} suplentes`] }]);
  K.secao('2. Elementos de autenticação');
  K.tabela([{ t: 'Elemento', w: 62 }, { t: 'Valor', w: K.CW - 62 }], [
    { c: ['Código de verificação', cod], b: true },
    { c: ['Impressão digital do resultado (SHA-256)', hash.match(/.{16}/g).join(' ')] },
    { c: ['Impressão digital do registro de atividades (SHA-256)', hashLog.match(/.{16}/g).join(' ')] },
    { c: ['Emitida em', fmtDT(agora)] },
    { c: ['Emitida por', emissor + ' (administrador do sistema)'] }]);
  K.paragrafo(`O código de verificação impresso na Ata de Apuração da Comissão Eleitoral corresponde aos 16 primeiros caracteres da impressão digital do resultado. Qualquer alteração nos números da apuração, nos nomes dos candidatos ou na data de encerramento produz uma impressão digital diferente.`, { s: 8.5, c: mut });
  K.secao('3. Resultado integral da apuração');
  const tot = R.total_votos || 0;
  K.tabela([{ t: '#', w: 9, a: 'r' }, { t: 'Candidato', w: 70 }, { t: 'Setor', w: 32 }, { t: 'Admissão', w: 22 }, { t: 'Votos', w: 16, a: 'r' }, { t: 'Resultado', w: K.CW - 149 }],
    R.candidatos.map(c => ({ c: [c.posicao, `${c.apelido} (${c.nome})`, c.setor, fmtD(c.admissao), c.votos, c.condicao], b: !!c.condicao }))
      .concat([{ c: ['', 'Votos em branco', '', '', R.brancos, ''] }, { c: ['', 'Votos nulos', '', '', R.nulos, ''] }, { c: ['', 'Total de votos', '', '', tot, ''], b: true }]));
  K.secao('4. Conferência de consistência');
  const ok = tot === R.votantes;
  K.tabela([{ t: 'Verificação', w: 110 }, { t: 'Valor', w: K.CW - 110, a: 'r' }], [
    { c: ['Eleitores aptos', R.aptos] },
    { c: ['Eleitores marcados como "já votou"', R.votantes] },
    { c: ['Votos registrados na urna eletrônica', tot] },
    { c: ['Diferença entre votantes e votos', ok ? '0 (consistente)' : String(tot - R.votantes)], b: true },
    { c: ['Participação', fmtPct(pctN(R.votantes, R.aptos))] },
    { c: ['Votos por período', (R.votos_por_fase || []).map(f => `${faseNome(f.fase)}: ${f.votos}`).join(' · ') || '—'] },
    { c: ['Códigos de acesso reemitidos pela comissão', cont('Código reemitido')] },
    { c: ['Consultas à lista de quem não votou', cont('Consultou lista de quem não votou')] },
    { c: ['Acessos da equipe ao painel', cont('Acesso ao painel')] }]);
  K.paragrafo('Cada voto é gravado no mesmo instante em que o eleitor é marcado como "já votou", numa única operação do banco de dados. Por isso o número de votantes e o número de votos registrados devem ser idênticos.', { s: 8.5, c: mut });
  K.secao('5. Linha do tempo da eleição');
  K.tabela([{ t: 'Data e hora', w: 32 }, { t: 'Evento', w: 44 }, { t: 'Responsável', w: 36 }, { t: 'Detalhe', w: K.CW - 112 }],
    linhaDoTempo(R).map(e => ({ c: [fmtDT(e.quando), e.acao, e.ator, e.detalhe] })));
  K.secao('6. Equipe da eleição');
  K.tabela([{ t: 'Nome', w: 90 }, { t: 'Função', w: K.CW - 90 }],
    R.equipe.map(m => ({ c: [m.nome, m.perfil === 'presidente' ? 'Presidente da Comissão Eleitoral' : 'Comissão Eleitoral'] })));
  K.secao('7. Registro completo de atividades');
  K.paragrafo(`${logAsc.length} registros, em ordem cronológica. O registro não contém nenhuma informação sobre em quem cada eleitor votou.`, { s: 8.5, c: mut });
  K.tabela([{ t: 'Data e hora', w: 32 }, { t: 'Quem', w: 40 }, { t: 'Ação', w: 46 }, { t: 'Detalhe', w: K.CW - 118 }],
    logAsc.map(l => ({ c: [fmtDT(l.quando), l.ator, l.acao, l.detalhe] })));
  K.secao('8. Garantias técnicas do sistema');
  [
    'Voto secreto: a tabela de votos não tem nenhum vínculo com o eleitor nem registra horário; o sistema guarda apenas que o eleitor votou.',
    'Um voto por eleitor: o eleitor é identificado por matrícula, data de nascimento e código de uso único; após o voto o código deixa de valer.',
    'Códigos de acesso e senhas da equipe são guardados apenas em forma embaralhada (hash), sem possibilidade de leitura.',
    'Contagem oculta: nenhum perfil, inclusive o administrador, vê votos por candidato antes do encerramento.',
    'Regras automáticas: prazo, participação mínima (NR-5), prorrogação e encerramento dependem de confirmações registradas da comissão eleitoral.',
    'Datas e horários são os do servidor do banco de dados, no fuso de Brasília, e não do aparelho de quem acessa.'
  ].forEach(t => K.paragrafo('• ' + t, { s: 9 }));
  K.secao('9. Declaração');
  K.paragrafo(`Declaro que este documento foi gerado pelo sistema de votação eletrônica a partir dos dados registrados na eleição acima identificada, sem qualquer alteração manual, e que os dados permanecem sob minha guarda para efeito de verificação.`, { s: 9.5 });
  K.quebra(30); K.y += 16;
  d.setDrawColor(120); d.setLineWidth(0.3); d.line(K.M, K.y, K.M + 90, K.y);
  K.T(emissor, K.M, K.y + 4.5, { b: 1, s: 9 }); K.T('Administrador do sistema · responsável pela guarda', K.M, K.y + 8.5, { s: 8, c: mut });
  K.y += 14;
  K.rodape(`Ata de verificação · via do administrador · ${cfg.empresa} · verificação ${cod}`);
  await salvarArquivo(`ata-verificacao-admin-${slug(cfg.empresa)}.pdf`, d.output('blob'));
}
async function baixarCedulas(lista, cfg) {
  const K = await pdfKit(cfg); const d = K.d; const mx = 10, my = 10, cw = (210 - 2 * mx) / 2, ch = (297 - 2 * my) / 4; const mut = [86, 103, 95];
  lista.forEach((e, i) => {
    const k = i % 8; if (i && k === 0) d.addPage();
    const cx = mx + (k % 2) * cw, cy = my + Math.floor(k / 2) * ch;
    d.setLineDashPattern([1.2, 1.2], 0); d.setDrawColor(170); d.setLineWidth(0.2); d.rect(cx, cy, cw, ch); d.setLineDashPattern([], 0);
    d.setFillColor(...K.cor); d.rect(cx + 4, cy + 6, 1.4, ch - 12, 'F');
    const x = cx + 9; let y = cy + 11;
    d.setFont('helvetica', 'bold'); d.setFontSize(9);
    K.T(d.splitTextToSize(cfg.empresa || '', cw - 50)[0], x, y, { b: 1, s: 9 });
    K.T('CÉDULA DE ACESSO', cx + cw - 6, y, { b: 1, s: 6.5, c: K.cor, opt: { align: 'right' } });
    y += 4.3; K.T([cfg.titulo, cfg.gestao].filter(Boolean).join(' · '), x, y, { s: 7.5, c: mut });
    y += 9; d.setFont('helvetica', 'bold'); d.setFontSize(11.5); K.T(d.splitTextToSize(e.nome, cw - 16)[0], x, y, { b: 1, s: 11.5 });
    y += 5; K.T(`Matrícula ${e.matricula}${e.setor ? ' · ' + e.setor : ''}`, x, y, { s: 8.5 });
    y += 9; K.T('CÓDIGO DE ACESSO', x, y, { b: 1, s: 6.5, c: mut });
    y += 9; K.T(e.codigo, x, y, { f: 'courier', b: 1, s: 24 });
    y += 7; d.setFontSize(7.3);
    K.T(d.splitTextToSize(`Acesse ${cfg.url_site || 'o site da votação'} e informe sua matrícula, sua data de nascimento e este código. Vale para um único voto. Não compartilhe.`, cw - 16), x, y, { s: 7.3, c: mut });
  });
  await salvarArquivo(`cedulas-acesso-${slug(cfg.empresa)}.pdf`, d.output('blob'));
}
async function baixarListaRH(lista, cfg) {
  const K = await pdfKit(cfg);
  K.cabecalho('LISTA DE CÓDIGOS DE ACESSO · CONFIDENCIAL', [cfg.titulo, cfg.gestao && 'Gestão ' + cfg.gestao, `${lista.length} eleitores`].filter(Boolean).join(' · '));
  K.paragrafo(`Documento para o RH enviar a cada eleitor o seu código individual. Cada código vale para um único voto. Não divulgue esta lista nem a deixe em local de acesso comum; após a distribuição, guarde-a com a comissão eleitoral ou descarte com segurança. Endereço da votação: ${cfg.url_site || 'informado pela comissão'}.`, { s: 8.5, c: [86, 103, 95] });
  K.tabela([{ t: 'Nome completo', w: 78 }, { t: 'Matrícula', w: 24 }, { t: 'Setor', w: 36 }, { t: 'Código de acesso', w: K.CW - 138 }],
    lista.map(e => ({ c: [e.nome, e.matricula, e.setor, e.codigo] })));
  K.rodape(`Urna CIPA · ${cfg.empresa} · CONFIDENCIAL · ${lista.length} códigos`);
  await salvarArquivo(`codigos-eleitores-RH-${slug(cfg.empresa)}.pdf`, K.d.output('blob'));
}
async function baixarListaEntrega(lista, cfg) {
  const K = await pdfKit(cfg);
  K.cabecalho('PROTOCOLO DE ENTREGA DAS CÉDULAS DE ACESSO', [cfg.titulo, cfg.gestao && 'Gestão ' + cfg.gestao].filter(Boolean).join(' · '));
  K.tabela([{ t: 'Nome', w: 62 }, { t: 'Matrícula', w: 22 }, { t: 'Setor', w: 30 }, { t: 'Data', w: 18 }, { t: 'Assinatura', w: K.CW - 132 }],
    lista.map(e => ({ c: [e.nome, e.matricula, e.setor, '', ''] })));
  K.rodape(`Urna CIPA · ${cfg.empresa} · ${lista.length} cédulas`);
  await salvarArquivo(`protocolo-entrega-cedulas-${slug(cfg.empresa)}.pdf`, K.d.output('blob'));
}

/* =====================================================================
   PAINEL DE TESTES (somente demonstração)
   ===================================================================== */
function demoBand() { return DEMO ? `<div class="demo-band"><button class="btn" id="b-demo"><span class="hide-sm">Demonstração · </span>Painel de testes</button></div>` : ''; }
function bindDemoBand() { const b = $('#b-demo'); if (b) b.onclick = abrirDemo; }
function abrirDemo() {
  const D = API._demo; const old = $('#drawer'); if (old) old.remove();
  const el = document.createElement('div'); el.id = 'drawer'; el.className = 'drawer';
  const st = D.status();
  el.innerHTML = `<div class="drawer-in" role="dialog" aria-label="Painel de testes">
    <div class="row" style="justify-content:space-between"><h2>Painel de testes</h2><button class="btn ghost" id="d-fechar">Fechar</button></div>
    <div class="msg attn">Modo demonstração. Empresa, pessoas e votos são fictícios e ficam só neste navegador. Relógio simulado: <b>${esc(fmtDT(new Date(D.agora()).toISOString()))}</b>.</div>
    <div class="card stack"><h3>Testar como eleitor</h3><p class="small muted">Clique em um eleitor para preencher a tela de votação.</p>
      <div class="scroll"><table class="tbl cred"><thead><tr><th>Matrícula</th><th>Nascimento</th><th>Código</th></tr></thead><tbody>
      ${D.testadores().map(t => `<tr data-v='${esc(JSON.stringify(t))}' style="cursor:pointer"><td>${esc(t.matricula)}</td><td>${esc(fmtD(t.nascimento))}</td><td>${esc(t.codigo)}</td></tr>`).join('') || '<tr><td colspan="3">Sem eleitores disponíveis.</td></tr>'}
      </tbody></table></div></div>
    <div class="card stack"><h3>Testar como equipe</h3>
      <div class="scroll"><table class="tbl cred"><thead><tr><th>Login</th><th>Senha</th><th>Perfil</th></tr></thead><tbody>
      ${D.equipe().map(m => `<tr data-s='${esc(JSON.stringify(m))}' style="cursor:pointer"><td>${esc(m.login)}</td><td>${esc(m.senha)}</td><td style="font-family:var(--f-body)">${esc(PERFIL[m.perfil])}</td></tr>`).join('')}
      </tbody></table></div><p class="small muted">Clique para entrar direto com esse perfil.</p></div>
    <div class="card stack"><h3>Simular o tempo</h3>
      <div class="row"><button class="btn ghost" id="d-sim" ${st === 'aberta' ? '' : 'disabled'}>Registrar 10 votos aleatórios</button>
      <button class="btn ghost" id="d-av" ${st === 'aberta' ? '' : 'disabled'}>Avançar até o fim do período</button></div>
      <p class="small muted">Para testar a prorrogação, avance o relógio com menos de 50% de participação. Depois peça a prorrogação como presidente e confirme com 3 membros da comissão eleitoral.</p></div>
    <div class="card stack"><h3>Recomeçar</h3>
      <div class="row"><button class="btn ghost" id="d-r1">Votação em andamento</button><button class="btn ghost" id="d-r2">Etapa de preparação</button></div>
      <p class="small muted">A preparação começa com eleitores e candidatos cadastrados, sem códigos, para testar cédulas e abertura.</p></div>
  </div>`;
  document.body.appendChild(el);
  const fechar = () => el.remove();
  el.addEventListener('click', ev => { if (ev.target === el) fechar(); });
  $('#d-fechar', el).onclick = fechar;
  $$('[data-v]', el).forEach(tr => tr.onclick = async () => {
    const t = JSON.parse(tr.dataset.v); fechar(); A.view = 'eleitor'; A.voto = { step: 'login', token: null, nome: '', escolha: null };
    await carregarEstado(); render();
    const m = $('#v-mat'); if (m && !m.disabled) { m.value = t.matricula; $('#v-nasc').value = fmtD(t.nascimento); $('#v-cod').value = t.codigo; $('#v-entrar').focus(); }
    else toast('A votação não está aberta agora. Use a equipe para avançar a eleição.');
  });
  $$('[data-s]', el).forEach(tr => tr.onclick = async () => {
    const m = JSON.parse(tr.dataset.s); fechar();
    try { const r = await API.equipeEntrar(m.login, m.senha); A.staff = { token: r.token, perfil: r.perfil, nome: r.nome, trocar: !!r.trocar_senha }; A.provisoria = r.trocar_senha ? m.senha : null; guardarStaff(); A.view = 'painel'; A.tab = 'acomp'; A.codigos = null; await abrirPainel(); } catch (e) { toast(e.message); }
  });
  const acao = async fn => { try { await fn(); } catch (e) { toast(e.message); } fechar(); if (A.view === 'painel') await atualizarPainel(true); else { await carregarEstado(); render(); } };
  $('#d-sim', el).onclick = () => acao(async () => { const n = D.simular(10); toast(`${n} votos simulados.`); });
  $('#d-av', el).onclick = () => acao(async () => { D.avancar(); toast('Relógio avançado até o fim do período.'); });
  $('#d-r1', el).onclick = () => acao(async () => { D.reset('andamento'); A.staff = null; guardarStaff(); A.view = 'eleitor'; A.voto = { step: 'login', token: null, nome: '', escolha: null }; A.cands = null; toast('Demonstração reiniciada com votação em andamento.'); });
  $('#d-r2', el).onclick = () => acao(async () => { D.reset('preparacao'); A.staff = null; guardarStaff(); A.view = 'eleitor'; A.voto = { step: 'login', token: null, nome: '', escolha: null }; A.cands = null; toast('Demonstração reiniciada na etapa de preparação.'); });
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
function render() {
  if (A.view === 'painel' && A.staff && A.staff.trocar) telaNovaSenha();
  else if (A.view === 'painel' && A.painel) renderPainel();
  else if (A.view === 'equipe-login') renderEquipeLogin();
  else renderEleitor();
}
setInterval(() => {
  $$('[data-cd]').forEach(el => {
    const f = el.dataset.cd; if (!f) return; const ms = Date.parse(f) - agoraSrv();
    el.textContent = dur(ms);
    if (ms <= 0 && !el.dataset.done) { el.dataset.done = '1'; setTimeout(() => atualizarPainel(true), 1500); }
  });
}, 1000);
setInterval(() => atualizarPainel(false), 15000);
setInterval(async () => {
  if (A.view === 'eleitor' && A.voto.step === 'login' && !document.activeElement.matches('input')) { try { await carregarEstado(); renderEleitor(); } catch (e) { /* tenta de novo depois */ } }
}, 60000);
(async function iniciar() {
  try { await carregarEstado(); } catch (e) {
    $('#app').innerHTML = `<main class="wrap narrow voter"><div class="msg err">${esc(e.message)}</div></main>`; return;
  }
  A.staff = lerStaff();
  if (A.staff) { A.view = 'painel'; await abrirPainel(); return; }
  if (location.hash === '#comissao') A.view = 'equipe-login';
  render();
})();
</script>
